<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSMT Ecommerce Semester Project</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@mui/material@5.15.0/umd/material-ui.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { 
            margin: 0; font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh; background-attachment: fixed;
        }
        .mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .sidebar { position: sticky; top: 24px; height: calc(100vh - 48px); overflow-y: auto; padding-right: 8px; }
        .m3-card { 
            background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            border-radius: 24px; padding: 24px; margin-bottom: 24px; 
        }
        .data-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        .icon-text { display: flex; align-items: center; gap: 8px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .bottom-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 1400px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 16px 32px; z-index: 1000;
            color: white; box-shadow: 0 10px 40px rgba(0,0,0,0.4); transition: transform 0.3s ease-in-out;
        }
        .bottom-bar.minimized { transform: translate(-50%, calc(100%)); }
        .toggle-btn {
            position: absolute; top: -15px; right: 40px; background: #3b82f6; color: white; border-radius: 50%;
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid white; z-index: 1001;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { createTheme, ThemeProvider, CssBaseline, Container, Typography, TextField, MenuItem, Button, Box, CircularProgress, Tabs, Tab, Grid, Divider, Stack, Alert, AlertTitle, Slider, Icon, Switch, FormControlLabel } = MaterialUI;

        const theme = createTheme({ 
            palette: { primary: { main: '#3b82f6' }, background: { default: 'transparent' } }, 
            shape: { borderRadius: 16 }, typography: { fontFamily: 'Poppins', h5: { fontWeight: 700 }, h6: { fontWeight: 600 } },
            components: { MuiTextField: { styleOverrides: { root: { '& .MuiOutlinedInput-root': { background: 'rgba(255,255,255,0.7)' } } } } }
        });

        // --- ICONS FOR M4 BUILDER ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Video = (p) => <IconBase {...p}><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></IconBase>;
        const ImageIcon = (p) => <IconBase {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></IconBase>;
        const LayoutIcon = (p) => <IconBase {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></IconBase>;
        const FileText = (p) => <IconBase {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></IconBase>;
        const ShieldCheck = (p) => <IconBase {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></IconBase>;
        const MessageSquare = (p) => <IconBase {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></IconBase>;
        const ShoppingCart = (p) => <IconBase {...p}><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></IconBase>;
        const ArrowUp = (p) => <IconBase {...p}><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></IconBase>;
        const ArrowDown = (p) => <IconBase {...p}><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></IconBase>;
        const Trash2 = (p) => <IconBase {...p}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconBase>;
        const Smartphone = (p) => <IconBase {...p}><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></IconBase>;

        const ELEMENTS_CATALOG = [
          { id: 'video_hero', name: '4K Auto-Play Video', cost: 50000, weight: 8.0, height: 100, isCTA: false, icon: Video, color: 'bg-indigo-100 border-indigo-400 text-indigo-800' },
          { id: 'img_carousel', name: 'High-Res Carousel', cost: 15000, weight: 4.0, height: 60, isCTA: false, icon: LayoutIcon, color: 'bg-blue-100 border-blue-400 text-blue-800' },
          { id: 'img_static', name: 'Compressed Hero Image', cost: 5000, weight: 0.5, height: 50, isCTA: false, icon: ImageIcon, color: 'bg-cyan-100 border-cyan-400 text-cyan-800' },
          { id: 'sticky_buy', name: 'Sticky "Buy Now"', cost: 35000, weight: 0.2, height: 10, isCTA: true, icon: ShoppingCart, color: 'bg-emerald-100 border-emerald-400 text-emerald-800' },
          { id: 'std_buy', name: 'Standard "Add to Cart"', cost: 5000, weight: 0.1, height: 15, isCTA: true, icon: ShoppingCart, color: 'bg-green-100 border-green-400 text-green-800' },
          { id: 'tech_specs', name: 'Detailed Specs', cost: 10000, weight: 0.5, height: 80, isCTA: false, icon: FileText, color: 'bg-slate-100 border-slate-400 text-slate-800' },
          { id: 'trust_badges', name: 'Secure Badges', cost: 10000, weight: 0.3, height: 20, isCTA: false, icon: ShieldCheck, color: 'bg-amber-100 border-amber-400 text-amber-800' },
          { id: 'video_reviews', name: 'Video Testimonials', cost: 25000, weight: 5.0, height: 70, isCTA: false, icon: MessageSquare, color: 'bg-purple-100 border-purple-400 text-purple-800' }
        ];

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyX6MniGhWOILDUQQlxSTPmKxFM8wilkTP3qiQ0Tq3ZbZCVPFJaZcBrJ-Uc_UNZ_YCoNw/exec"; 

        const NICHE_DATA = {
            "Beauty": { china: 350, local: 700, kg: 0.15, cbm: 0.001, duty: 20, opt: 2500, cpa: 600, pack: 40, insight: "💄 High volume, low shipping costs. Market is saturated (high CPA). Impulse buys lead to medium RTO rates." },
            "Fashion": { china: 800, local: 1700, kg: 0.5, cbm: 0.003, duty: 15, opt: 4800, cpa: 850, pack: 60, insight: "👗 Average shipping costs, but sizing issues cause the highest RTO rates. Requires aggressive marketing budgets." },
            "Electronics": { china: 2800, local: 5500, kg: 0.25, cbm: 0.001, duty: 25, opt: 15000, cpa: 1500, pack: 100, insight: "📱 High ticket sizes require massive liquid cash flow. RTO rates are lower, but you will pay the highest Customs Duties." },
            "Furniture": { china: 5200, local: 9500, kg: 3.5, cbm: 0.035, duty: 10, opt: 35000, cpa: 3000, pack: 250, insight: "🛋️ Highly bulky. Air freight destroys margins. Demand is inelastic. Very low RTO rates." },
            "Sports": { china: 1200, local: 2500, kg: 0.8, cbm: 0.006, duty: 15, opt: 8000, cpa: 1000, pack: 80, insight: "⚽ Bulky items increase local courier costs. Steady year-round demand with moderate RTOs." },
            "Supplements": { china: 1800, local: 3200, kg: 0.35, cbm: 0.002, duty: 20, opt: 9500, cpa: 1200, pack: 50, insight: "💊 High recurring revenue, but high CPA due to ad compliance. Extremely low RTO rate." }
        };

        const COURIERS = { 
            "Premium": { ship: 250, rtoRate: 0.08, rtoPen: 200, holdback: 0.15 }, 
            "Standard": { ship: 150, rtoRate: 0.15, rtoPen: 150, holdback: 0.45 }, 
            "Economy": { ship: 120, rtoRate: 0.22, rtoPen: 100, holdback: 0.75 } 
        };

        const UX_DESCRIPTIONS = {
            "Guest (1-Click)": "Guest checkout guarantees the highest possible conversion rates from impulse buyers. However, without verifying buyer intent, your store becomes highly vulnerable to prank orders and fake addresses.",
            "Account Required": "Requiring an account introduces a moderate layer of friction. This extra step naturally weeds out the most impulsive buyers. While you will see a noticeable drop in conversion rate, the quality of your orders will be significantly higher.",
            "OTP Mandatory": "A Mandatory OTP verification step is the most aggressive form of friction. This stringent barrier will absolutely decimate your impulse sales, drastically inflating your CAC. However, it ensures every order is from a high-intent buyer."
        };

        function PerformanceChart({ results }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            useEffect(() => {
                if(chartInstance.current) chartInstance.current.destroy();
                if(!results || results.length === 0) return;
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: results.map(r => `Mod ${r[2]}`),
                        datasets: [
                            { label: 'Net Cash Flow (Rs)', data: results.map(r => r[12]), borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true, tension: 0.4, yAxisID: 'y' },
                            { label: 'Brand Score', data: results.map(r => r[13]), borderColor: '#8b5cf6', backgroundColor: 'rgba(139, 92, 246, 0.1)', fill: true, tension: 0.4, yAxisID: 'y1' }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { position: 'left' }, y1: { position: 'right', grid: {drawOnChartArea: false} } } }
                });
            }, [results]);
            return <div style={{height: '300px'}}><canvas ref={chartRef}></canvas></div>;
        }

        function App() {
            const [view, setView] = useState("auth"); 
            const [authTab, setAuthTab] = useState(0); 
            const [navTab, setNavTab] = useState(0);
            const [minimized, setMinimized] = useState(false);
            const [status, setStatus] = useState("idle");
            const [user, setUser] = useState(null); 

            const [form, setForm] = useState({ rollNo: "", email: "", password: "", ceoName: "", companyName: "", niche: "Beauty" });
            const [m1, setM1] = useState({ method: "Local", courier: "Standard", qty: 0, budget: 0, gVal: "", cif: "", duty: "", gstV: "", gstP: "", landed: "", trueU: "", price: 0, gross: "", op: "" });
            const [m2, setM2] = useState({ useBridge: false, bridgeMethod: "Local", bridgeQty: 0, recurringModel: "", trialStrategy: "", churnStrategy: "", subDiscount: 10 });
            const [m3, setM3] = useState({ prepaidTarget: 0, checkoutUX: "Guest (1-Click)", foggStrategy: "", asymmetryScript: "", cccStrategy: "", useWinBack: false });

            const [stack, setStack] = useState([]);
            const [m4Strategy, setM4Strategy] = useState(''); 
            const [loanAmount, setLoanAmount] = useState(0);

            const cleanNum = (val) => val.replace(/[^0-9.]/g, '');

            useEffect(() => {
                const saved = localStorage.getItem('student_creds');
                if(saved) {
                    const creds = JSON.parse(saved);
                    setForm(f => ({...f, email: creds.email, password: creds.password}));
                    handleAuth(true, creds.email, creds.password);
                }
            }, []);

            const handleAuth = async (isLogin, em = form.email, pw = form.password) => {
                setStatus("loading");
                try {
                    if(isLogin) {
                        const res = await fetch(`${SCRIPT_URL}?action=login&email=${encodeURIComponent(em)}&password=${encodeURIComponent(pw)}`).then(r => r.json());
                        if(res.status === "success") { 
                            res.data.module = parseInt(res.data.module, 10);
                            setUser(res.data); 
                            
                            if (res.data.pendingDecision) {
                                const pd = res.data.pendingDecision;
                                let mMethod = pd.method;
                                let useBridge = false; let bridgeMethod = "Local";
                                if (mMethod.includes(" / ")) {
                                    useBridge = true; mMethod = mMethod.split(" / ")[0]; bridgeMethod = pd.method.split(" / ")[1] || "Local";
                                }
                                let ux = "Guest (1-Click)", prep = 0, wb = false, ccc = pd.recurringModel;
                                if (res.data.module === 3 && pd.recurringModel.startsWith("[")) {
                                    const m = pd.recurringModel.match(/\[UX: (.*?) \| Prepaid: (\d+)% \| WinBack: (YES|NO)\] CCC: (.*)/);
                                    if (m) { ux = m[1]; prep = parseInt(m[2]); wb = (m[3]==='YES'); ccc = m[4]; }
                                }

                                setM1({ method: mMethod, courier: pd.courier, qty: pd.qty, budget: pd.budget, gVal: pd.gVal, cif: pd.cif, duty: pd.duty, gstV: pd.gstV, gstP: pd.gstP, landed: pd.landed, trueU: pd.trueU, price: pd.price, gross: pd.gross, op: pd.op });
                                setM2({ useBridge, bridgeMethod, bridgeQty: 0, recurringModel: pd.recurringModel, trialStrategy: pd.trialStrategy, churnStrategy: pd.churnStrategy, subDiscount: pd.subDiscount });
                                setM3({ prepaidTarget: prep, checkoutUX: ux, foggStrategy: pd.trialStrategy, asymmetryScript: pd.churnStrategy, cccStrategy: ccc, useWinBack: wb });
                                
                            } else if (res.data.module > 1 && res.data.lastBudget) {
                                const newBudget = res.data.module >= 4 ? 0 : res.data.lastBudget;
                                setM1(prev => ({...prev, budget: newBudget, price: res.data.lastPrice}));
                            }
                            
                            setView("dashboard");
                            localStorage.setItem('student_creds', JSON.stringify({email: em, password: pw}));
                        } else { alert(res.message); localStorage.removeItem('student_creds'); }
                    } else { 
                        if (!/^(BSMT|MSMT|BMST)\d{5}$/i.test(form.rollNo)) return alert("Invalid Roll No.");
                        if (!form.email.endsWith("@itu.edu.pk")) return alert("Email must end in @itu.edu.pk");
                        await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams({action: "register", ...form}) });
                        alert("Incorporated! Please Login."); setAuthTab(0); 
                    }
                } catch (e) { alert("Connection Error."); }
                setStatus("idle");
            };

            const logout = () => { localStorage.removeItem('student_creds'); setUser(null); setView("auth"); }

            const addElement = (element) => { setStack([...stack, { ...element, uniqueId: Math.random() }]); };
            const removeElement = (index) => { setStack(stack.filter((_, i) => i !== index)); };
            const moveUp = (index) => {
                if (index === 0) return;
                const newStack = [...stack];
                [newStack[index - 1], newStack[index]] = [newStack[index], newStack[index - 1]];
                setStack(newStack);
            };
            const moveDown = (index) => {
                if (index === stack.length - 1) return;
                const newStack = [...stack];
                [newStack[index + 1], newStack[index]] = [newStack[index], newStack[index + 1]];
                setStack(newStack);
            };

            // --- DASHBOARD RENDER LOGIC ---
            if (view === "dashboard" && user) {
                const s = NICHE_DATA[user.niche]; 
                const c = COURIERS[m1.courier] || COURIERS["Standard"]; 
                
                const m2CpaMultiplier = user.module >= 2 ? 1.5 : 1.0;
                const actualCpa = Math.floor(s.cpa * m2CpaMultiplier);
                const totalCapEx = (user.module == 4) ? stack.reduce((sum, el) => sum + el.cost, 0) : 0;
                
                const m2ResultRecord = user.results ? user.results.find(r => r[2] == 2) : null;
                const m3ResultRecord = user.results ? user.results.find(r => r[2] == 3) : null;
                
                let baseActiveSubscribers = 0;
                let m2Delivered = 0;

                if (user.module >= 4 && m3ResultRecord) {
                    baseActiveSubscribers = parseInt(m3ResultRecord[15] || 0);
                    if (!baseActiveSubscribers && m2ResultRecord) baseActiveSubscribers = parseInt(m2ResultRecord[15] || 0);
                } else if (user.module === 3) {
                    m2Delivered = m2ResultRecord ? parseInt(m2ResultRecord[7] || 0) : 0;
                    baseActiveSubscribers = m2ResultRecord ? parseInt(m2ResultRecord[15] || 0) : 0;
                } else {
                    m2Delivered = m2ResultRecord ? parseInt(m2ResultRecord[7] || 0) : 0;
                    baseActiveSubscribers = m2ResultRecord ? parseInt(m2ResultRecord[15] || 0) : 0;
                }
                
                const churnedCustomers = Math.max(0, m2Delivered - baseActiveSubscribers);
                const retentionRate = m2Delivered > 0 ? Math.round((baseActiveSubscribers / m2Delivered) * 100) : 0;
                const churnRate = m2Delivered > 0 ? Math.round((churnedCustomers / m2Delivered) * 100) : 0;

                const recoveredCustomers = Math.floor(churnedCustomers * 0.4);
                
                let finalSubscribers = baseActiveSubscribers;
                if (user.module == 3 && m3.useWinBack) {
                    finalSubscribers += recoveredCustomers;
                }

                // THE PERFECTED GETPROJ FUNCTION
                const getProj = () => {
                    if(!m1.price) return { demand: 0, dispatched: 0, effectiveAvailForBackend: 0, m2Avail: 0, m3Avail: 0, rev: 0, prof: 0, retainedRev: 0, retainedProfit: 0, newProfit: 0, lockup: 0, shippingCost: 0, packCostTotal: 0, gatewayTotal: 0 };
                    
                    const organicBase = user.module >= 2 ? Math.floor(finalSubscribers / 2) : 0; 
                    const budgetBase = Math.floor((parseFloat(m1.budget) || 0) / actualCpa);
                    const totalBaseTraffic = organicBase + budgetBase;
                    
                    const priceElasticity = Math.pow((s.opt / (parseFloat(m1.price)||s.opt)), 1.8);
                    const boundedElasticity = Math.min(3.0, priceElasticity); 
                    
                    let m3DemandMultiplier = 1.0;
                    let finalRtoRate = c.rtoRate;

                    if (user.module >= 3) {
                        let uxRtoMod = 1.0;
                        if (m3.checkoutUX === "Guest (1-Click)") { m3DemandMultiplier = 1.0; uxRtoMod = 1.5; }
                        else if (m3.checkoutUX === "Account Required") { m3DemandMultiplier = 0.85; uxRtoMod = 0.9; }
                        else if (m3.checkoutUX === "OTP Mandatory") { m3DemandMultiplier = 0.65; uxRtoMod = 0.2; }

                        const prepaidFriction = 1 - (m3.prepaidTarget / 100) * 0.25; 
                        m3DemandMultiplier *= prepaidFriction;

                        const codShare = 1 - (m3.prepaidTarget / 100);
                        const codRateDecimal = Math.max(0.65, 0.95 - (user.brand / 150) * 0.30);
                        
                        finalRtoRate = (c.rtoRate * codRateDecimal) * uxRtoMod * codShare;
                        finalRtoRate = Math.min(0.80, finalRtoRate); 
                    }

                    const newDemand = Math.floor(totalBaseTraffic * boundedElasticity * (user.brand / 100) * m3DemandMultiplier);
                    const demand = user.module >= 3 ? newDemand + finalSubscribers : newDemand;
                    
                    const primaryQty = parseInt(m1.qty) || 0;
                    const bridgeQty = (user.module == 2 && m2.useBridge) ? (parseInt(m2.bridgeQty) || 0) : 0;
                    
                    let m2Primary = primaryQty; let m3Primary = 0;
                    if (user.module == 2) {
                        if (m1.method === "China_Sea") { m2Primary = 0; m3Primary = primaryQty; }
                        else if (m1.method === "China_Air") { m2Primary = Math.floor(primaryQty * 0.5); m3Primary = primaryQty - m2Primary; }
                    }
                    
                    let m2Bridge = bridgeQty; let m3Bridge = 0;
                    if (user.module == 2 && m2.useBridge) {
                        if (m2.bridgeMethod === "China_Air") { m2Bridge = Math.floor(bridgeQty * 0.5); m3Bridge = bridgeQty - m2Bridge; }
                    }
                    
                    const m2Avail = parseInt(user.inventory) + m2Primary + m2Bridge; 
                    const m3Avail = m3Primary + m3Bridge; 
                    const effectiveAvailForBackend = user.module >= 3 ? primaryQty : (m2Primary + m2Bridge); 
                    
                    const totalBatchAvail = parseInt(user.inventory) + (user.module >= 3 ? (m1.method === "Local" ? primaryQty : (m1.method === "China_Air" ? Math.floor(primaryQty * 0.5) : 0)) : primaryQty + bridgeQty);
                    const dispatched = Math.min(demand, totalBatchAvail); 
                    
                    const subsDispatched = user.module >= 3 ? Math.min(finalSubscribers, dispatched) : 0;
                    const newDispatched = Math.max(0, dispatched - subsDispatched);
                    
                    const rtoUnits = Math.floor(newDispatched * finalRtoRate);
                    const newDelivered = newDispatched - rtoUnits;
                    
                    const unitTrueCost = parseFloat(m1.trueU) || 0;
                    const effectivePrice = user.module == 2 ? m1.price * (1 - m2.subDiscount/100) : m1.price;
                    
                    const retainedRev = subsDispatched * effectivePrice;
                    const newRev = newDelivered * effectivePrice;
                    const rev = retainedRev + newRev;

                    const codShare = user.module >= 3 ? (1 - m3.prepaidTarget / 100) : 1.0;
                    const newCodRev = newRev * codShare;
                    const lockup = newCodRev * c.holdback;
                    
                    const retainedCogs = subsDispatched * unitTrueCost;
                    const newCogs = newDelivered * unitTrueCost;

                    const marketingCost = parseFloat(m1.budget) || 0; 
                    
                    const retainedShip = subsDispatched * c.ship;
                    const newShip = (newDelivered * c.ship) + (rtoUnits * (c.ship + c.rtoPen));
                    const shippingCost = retainedShip + newShip;
                    
                    const retainedPack = subsDispatched * s.pack;
                    const newPack = newDispatched * s.pack;
                    const packCostTotal = retainedPack + newPack;
                    
                    const retainedGateway = retainedRev * 0.025;
                    const newGateway = newRev * 0.025;
                    const gatewayTotal = retainedGateway + newGateway;

                    const retainedProfit = retainedRev - retainedCogs - retainedShip - retainedPack - retainedGateway;
                    const newProfit = newRev - newCogs - newShip - newPack - newGateway - marketingCost;
                    
                    const prof = retainedProfit + newProfit;

                    return { demand, dispatched, effectiveAvailForBackend, m2Avail, m3Avail, rev, prof, retainedRev, retainedProfit, newProfit, lockup, shippingCost, packCostTotal, gatewayTotal };
                };

                const p = getProj();

                const localMultiplier = (user.module >= 3) ? 1.4 : 1.0; 
                const baseCost = m1.method === "Local" ? Math.floor(s.local * localMultiplier) : s.china;
                const freightDisplay = m1.method === "Local" ? "Rs 150 / Unit" : (m1.method === "China_Air" ? "Rs 3,100 / KG" : "Rs 90,000 / CBM");
                const insuranceDisplay = m1.method === "Local" ? "0%" : "1% of C&F Value"; 
                
                const winBackCost = (user.module == 3 && m3.useWinBack) ? churnedCustomers * Math.floor(actualCpa * 1.5) : 0;
                const appliedWinBackPenalty = (user.module == 3 && m3.useWinBack) ? winBackCost : 0;
                
                const lastRev = (user.results && user.results.length > 0) ? parseFloat(user.results[user.results.length - 1][8]) : 0;
                const estimatedLocked = user.module > 1 ? Math.floor(lastRev * 0.15) : 0; 
                
                const baseLiquid = parseInt(user.cash) + estimatedLocked;
                
                const oldLandedCost = user.pendingDecision && !user.hasSubmittedCurrentModule ? parseFloat(user.pendingDecision.landed) : 0;
                const liquidCashAvailable = baseLiquid + oldLandedCost;

                const totalQtyToOrder = (parseInt(m1.qty)||0) + (user.module == 2 && m2.useBridge ? (parseInt(m2.bridgeQty)||0) : 0);
                const estProcurement = totalQtyToOrder * (parseFloat(m1.trueU) || 0);
                const m4CapexActual = (user.module == 4) ? totalCapEx : 0;
                
                const holdingCostCalc = user.module >= 3 ? Math.max(0, (parseInt(user.inventory) + (m1.method === "Local" ? totalQtyToOrder : (m1.method === "China_Air" ? Math.floor(totalQtyToOrder * 0.5) : 0)) - p.dispatched)) * 50 : 0;
                
                const liveSpend = estProcurement + (parseFloat(m1.budget) || 0) + appliedWinBackPenalty + m4CapexActual + p.shippingCost + p.packCostTotal + p.gatewayTotal + holdingCostCalc;
                
                const remainingAfterBudget = liquidCashAvailable + loanAmount - liveSpend;
                
                const totalProjectedProfit = p.prof - (user.module == 4 ? totalCapEx : 0);
                const liquidCashInflow = totalProjectedProfit - p.lockup;

                const hasTrueUnitCost = m1.trueU && parseFloat(m1.trueU) > 0;

                // --- FIX FOR LOCKED SCREEN ---
                let finalLiveSpend = liveSpend;
                let finalRemaining = remainingAfterBudget;

                if (user.hasSubmittedCurrentModule) {
                    let savedCapEx = 0;
                    if (user.pendingDecision && user.pendingDecision.recurringModel) {
                        const cxMatch = user.pendingDecision.recurringModel.match(/\[CRO CapEx: (\d+)\]/);
                        if (cxMatch) savedCapEx = parseInt(cxMatch[1]);
                    }
                    const lockedCapEx = (user.module == 4) ? savedCapEx : 0;
                    
                    // The backend already deducted inventory and added the loan to user.cash.
                    // So we only display the deduction of Operational Spend (Marketing + CapEx + Shipping/Gateway)
                    finalLiveSpend = finalLiveSpend - estProcurement - m4CapexActual + lockedCapEx;
                    finalRemaining = liquidCashAvailable - finalLiveSpend; 
                }

                const submit = async () => {
                    if(remainingAfterBudget < 0) return alert("Insufficient Liquid Cash! You exceed your available funds after CapEx, budgeting, and operational costs. Try taking a Loan from the top bar.");
                    if(!m1.landed || !m1.trueU || !m1.price) return alert("Error: Please complete the manual calculations in the Procure-to-Pay section.");
                    
                    if (user.module == 2) {
                        if ((m2.recurringModel || "").trim().length < 50 || (m2.trialStrategy || "").trim().length < 50 || (m2.churnStrategy || "").trim().length < 50) {
                            return alert("Error: All CEO Strategy text boxes must be at least 50 characters long to submit.");
                        }
                    }
                    if (user.module == 3) {
                        if ((m3.foggStrategy || "").trim().length < 50 || (m3.asymmetryScript || "").trim().length < 50 || (m3.cccStrategy || "").trim().length < 50) {
                            return alert("Error: You must academically justify all three of your Module 3 decisions with at least 50 characters each.");
                        }
                    }
                    if (user.module == 4) {
                        if (stack.length === 0) return alert("Error: You must build your UI layout by clicking elements from the Catalog.");
                        if (m4Strategy.trim().length < 50) return alert("Error: You must provide a strategic justification (min 50 chars).");
                    }

                    setStatus("busy");
                    const finalMethod = (user.module == 2 && m2.useBridge) ? m1.method + " / " + m2.bridgeMethod : m1.method;
                    const finalQty = (user.module == 2 && m2.useBridge) ? parseInt(m1.qty) + parseInt(m2.bridgeQty) : m1.qty;

                    let payload = {
                        action: "submitDecision", companyId: user.companyId, module: user.module,
                        method: finalMethod, courier: m1.courier, qty: finalQty, marketingBudget: m1.budget,
                        gVal: m1.gVal, cif: m1.cif, duty: m1.duty, gstV: m1.gstV, gstP: m1.gstP,
                        totalLanded: m1.landed, trueU: m1.trueU, price: m1.price, grossMargin: m1.gross, opMargin: m1.op,
                        effectiveAvail: getProj().effectiveAvailForBackend,
                        loanTaken: loanAmount
                    };

                    if (user.module == 2) {
                        payload.recurringModel = m2.recurringModel.trim();
                        payload.trialStrategy = m2.trialStrategy.trim();
                        payload.churnStrategy = m2.churnStrategy.trim();
                        payload.subDiscount = m2.subDiscount;
                    } else if (user.module == 3) {
                        payload.recurringModel = `[UX: ${m3.checkoutUX} | Prepaid: ${m3.prepaidTarget}% | WinBack: ${m3.useWinBack ? 'YES' : 'NO'}] CCC: ${m3.cccStrategy.trim()}`;
                        payload.trialStrategy = m3.foggStrategy.trim(); 
                        payload.churnStrategy = m3.asymmetryScript.trim(); 
                        payload.subDiscount = 0;
                    } else if (user.module == 4) {
                        payload.recurringModel = `[CRO CapEx: ${totalCapEx}]`;
                        payload.trialStrategy = JSON.stringify(stack.map(s => s.id));
                        payload.churnStrategy = `Logic: ${m4Strategy.trim()}`;
                        payload.subDiscount = 0;
                    }

                    try {
                        await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams(payload)});
                        setUser({...user, hasSubmittedCurrentModule: true});
                        alert(`Module ${user.module} Strategy Locked successfully!`); 
                        setStatus("locked");
                    } catch(e) {
                        alert("Connection Error. Please check your internet and try again.");
                        setStatus("idle");
                    }
                };

                return (
                    <ThemeProvider theme={theme}><CssBaseline />
                        <Container maxWidth="xl" sx={{ pt: 4, pb: 20 }}>
                            <Box display="flex" justifyContent="space-between" alignItems="center" mb={3}>
                                <div>
                                    <Typography variant="h4" fontWeight="bold" color="#1e293b" className="icon-text">
                                        <Icon sx={{fontSize: 32, color: '#3b82f6'}}>dashboard</Icon> {user.companyName} <span style={{fontSize:'18px', color:'#94a3b8'}}>| Mod {user.module >= 5 ? "4 (Completed)" : user.module}</span>
                                    </Typography>
                                    <Typography variant="body1" color="#475569" sx={{ml: 5}}>{user.rollNo} • Niche: {user.niche}</Typography>
                                </div>
                                <Box display="flex" alignItems="center" gap={2}>
                                    <Box textAlign="right" display="flex" flexWrap="wrap" gap={2} p={1.5} sx={{background: 'rgba(255,255,255,0.7)', borderRadius: 2, border: '1px solid rgba(0,0,0,0.1)'}}>
                                        <Box textAlign="left" sx={{borderRight: '1px solid rgba(0,0,0,0.1)', pr: 2}}>
                                            <Typography variant="caption" color="text.secondary" display="block">Base Equity & Cleared Cash</Typography>
                                            <Typography variant="h6" className="mono" color="#1e293b" lineHeight={1}>Rs {parseInt(user.cash).toLocaleString()}</Typography>
                                            <Typography variant="caption" className="mono" color="#10b981">+ Rs {Math.floor(estimatedLocked).toLocaleString()} M3 Cleared</Typography>
                                            <Typography variant="caption" className="mono" color="#475569" display="block">{user.inventory} Units | {user.brand} Score</Typography>
                                        </Box>
                                        
                                        <Box textAlign="left" sx={{borderRight: '1px solid rgba(0,0,0,0.1)', pr: 2}}>
                                            <Typography variant="caption" color="error.main" display="block">Live Operational Spend</Typography>
                                            <Typography variant="h6" className="mono" color="error.main" lineHeight={1}>- Rs {Math.floor(finalLiveSpend).toLocaleString()}</Typography>
                                            <Typography variant="caption" className="mono" color="#f59e0b">Est Next Lock: Rs {Math.floor(p.lockup).toLocaleString()}</Typography>
                                        </Box>

                                        <Box textAlign="left" sx={{borderLeft: '2px solid #10b981', pl: 2}}>
                                            <Typography variant="caption" color={finalRemaining >= 0 ? "#10b981" : "error.main"} fontWeight="bold" display="block">Liquid Cash Remaining</Typography>
                                            <Typography variant="h5" className="mono" color={finalRemaining >= 0 ? "#10b981" : "error.main"} lineHeight={1}>Rs {Math.floor(finalRemaining).toLocaleString()}</Typography>
                                        </Box>
                                    </Box>
                                    <Button variant="contained" color="error" onClick={logout} startIcon={<Icon>logout</Icon>} sx={{height: 'fit-content'}}>Logout</Button>
                                </Box>
                            </Box>

                            {/* --- DEBT FACILITY ROW --- */}
                            {user.module <= 4 && !user.hasSubmittedCurrentModule && (
                                <Box sx={{background: 'rgba(255,255,255,0.7)', borderRadius: 2, border: '1px solid rgba(245, 158, 11, 0.3)', p: 2, mb: 3}}>
                                    <Grid container spacing={3} alignItems="center">
                                        <Grid item xs={12} md={3}>
                                            <Typography variant="body2" fontWeight="bold" color="#d97706" className="icon-text">
                                                <Icon sx={{fontSize: 20}}>account_balance</Icon> Debt Facility
                                            </Typography>
                                            <Typography variant="caption" color="text.secondary" display="block">Minimum Rs 1,000,000 to borrow.</Typography>
                                            {loanAmount > 0 && <Typography variant="caption" color="#ef4444" display="block" mt={0.5}>Est. Semester End Payoff: <b>Rs {(loanAmount * 1.30).toLocaleString()}</b> (Includes 30% Interest)</Typography>}
                                        </Grid>
                                        <Grid item xs={12} md={6}>
                                            <Slider 
                                                value={loanAmount} 
                                                min={0} max={10000000} step={100000} 
                                                onChange={(e,v) => setLoanAmount(v > 0 && v < 1000000 ? 1000000 : v)} 
                                                sx={{color: '#f59e0b'}} 
                                                marks={[{value: 0, label: 'No Loan'}, {value: 1000000, label: '1M'}, {value: 10000000, label: 'Max 10M'}]}
                                            />
                                        </Grid>
                                        <Grid item xs={12} md={3} textAlign="right">
                                            <Typography variant="h5" className="mono" color="#d97706">+ Rs {loanAmount.toLocaleString()}</Typography>
                                        </Grid>
                                    </Grid>
                                </Box>
                            )}

                            <Tabs value={navTab} onChange={(e,v)=>setNavTab(v)} sx={{mb:3}}>
                                <Tab icon={<Icon sx={{fontSize: 20}}>build_circle</Icon>} iconPosition="start" label="Operations & Strategy" />
                                <Tab icon={<Icon sx={{fontSize: 20}}>insights</Icon>} iconPosition="start" label="Historical Performance" />
                            </Tabs>

                            {navTab === 0 && user.module >= 5 && (
                                <div className="m3-card" style={{textAlign: 'center', padding: '80px 20px', border: '2px dashed rgba(139, 92, 246, 0.5)'}}>
                                    <Icon sx={{fontSize: 80, color: '#8b5cf6', mb: 2}}>lock</Icon>
                                    <Typography variant="h4" fontWeight="bold" color="#1e293b" mb={2}>Module 5 is Locked</Typography>
                                    <Typography variant="body1" color="#475569" mb={4} maxWidth="600px" mx="auto">
                                        Congratulations on completing Module 4! The Board of Directors is currently reviewing your metrics.
                                    </Typography>
                                    <Button variant="contained" size="large" onClick={() => setNavTab(1)} startIcon={<Icon>insights</Icon>} sx={{borderRadius: '50px', px: 4, py: 1.5}}>
                                        View Your Results
                                    </Button>
                                </div>
                            )}

                            {navTab === 0 && user.hasSubmittedCurrentModule && user.module <= 4 && (
                                <div className="m3-card" style={{textAlign: 'center', padding: '80px 20px', border: '2px dashed rgba(59, 130, 246, 0.5)'}}>
                                    <Icon sx={{fontSize: 80, color: '#3b82f6', mb: 2}}>hourglass_empty</Icon>
                                    <Typography variant="h4" fontWeight="bold" color="#1e293b" mb={2}>Decision Locked & Awaiting Processing</Typography>
                                    <Typography variant="body1" color="#475569" mb={4} maxWidth="600px" mx="auto">
                                        Your strategy for Module {user.module} has been securely submitted. The simulation engine is waiting for the instructor to process the batch.
                                    </Typography>
                                    <Box display="flex" gap={2} justifyContent="center">
                                        <Button variant="outlined" size="large" onClick={() => setUser({...user, hasSubmittedCurrentModule: false})} startIcon={<Icon>edit</Icon>} sx={{borderRadius: '50px', px: 4, py: 1.5, background: 'rgba(255,255,255,0.8)'}}>
                                            Edit Decision
                                        </Button>
                                        <Button variant="contained" size="large" onClick={() => setNavTab(1)} startIcon={<Icon>insights</Icon>} sx={{borderRadius: '50px', px: 4, py: 1.5}}>
                                            Review Past Results
                                        </Button>
                                    </Box>
                                </div>
                            )}

                            {navTab === 0 && user.module <= 4 && !user.hasSubmittedCurrentModule && (
                                <Grid container spacing={4}>
                                    
                                    {/* --- SIDEBAR FOR PROCUREMENT (PERSISTS ACROSS ALL MODULES) --- */}
                                    <Grid item xs={12} md={4}>
                                        <Box className="sidebar">
                                            <div className="m3-card">
                                                <Typography variant="overline" color="primary" fontWeight="bold" className="icon-text"><Icon sx={{fontSize: 18}}>inventory_2</Icon> DYNAMIC DOSSIER: {user.niche}</Typography>
                                                <div className="data-row" style={{marginTop: '10px'}}>
                                                    <Typography variant="body2">Unit Cost (FOB)</Typography>
                                                    <Typography className="mono" color={user.module >= 3 && m1.method === 'Local' ? 'error.main' : 'inherit'}>
                                                        Rs {baseCost} {user.module >= 3 && m1.method === 'Local' ? '(+40% Shock)' : ''}
                                                    </Typography>
                                                </div>
                                                <div className="data-row"><Typography variant="body2">Weight / Volume</Typography><Typography className="mono">{s.kg}KG / {s.cbm}CBM</Typography></div>
                                                <div className="data-row"><Typography variant="body2" fontWeight="bold">Active Freight Rate</Typography><Typography className="mono" fontWeight="bold">{freightDisplay}</Typography></div>
                                                <div className="data-row"><Typography variant="body2">Insurance Cost</Typography><Typography className="mono">{insuranceDisplay}</Typography></div>
                                                <div className="data-row"><Typography variant="body2">Import Duty / GST Rate</Typography><Typography className="mono">{m1.method === "Local" ? "0%" : `${s.duty}%`} / 18%</Typography></div>
                                                <div className="data-row"><Typography variant="body2">Agent / Misc Fees</Typography><Typography className="mono">{m1.method === "Local" ? "Rs 0" : "Rs 12,800 / Rs 10k"}</Typography></div>
                                                
                                                <Divider sx={{my:2}}/>
                                                <Typography variant="overline" color="primary" fontWeight="bold" className="icon-text"><Icon sx={{fontSize: 18}}>local_shipping</Icon> FULFILLMENT & CCC: {m1.courier}</Typography>
                                                <div className="data-row" style={{marginTop: '10px'}}><Typography variant="body2" color="secondary" fontWeight="bold">Baseline Niche CAC</Typography><Typography className="mono" fontWeight="bold">Rs {actualCpa}</Typography></div>
                                                <div className="data-row"><Typography variant="body2">Courier Delivery Cost</Typography><Typography className="mono">Rs {c.ship}</Typography></div>
                                                <div className="data-row"><Typography variant="body2">Pack & Gateway Fee</Typography><Typography className="mono">Rs {s.pack} / 2.5%</Typography></div>
                                                <div className="data-row"><Typography variant="body2" color="error.main">Est. COD RTO Penalty</Typography><Typography className="mono" color="error.main">{(c.rtoRate * 100).toFixed(0)}% / Rs {c.rtoPen}</Typography></div>
                                                <div className="data-row" style={{background: 'rgba(245, 158, 11, 0.1)', padding: '4px'}}><Typography variant="body2" color="#d97706" fontWeight="bold">COD Cash Holdback</Typography><Typography className="mono" color="#d97706" fontWeight="bold">{(c.holdback * 100).toFixed(0)}% Locked</Typography></div>
                                            </div>

                                            <div className="m3-card">
                                                <Typography variant="h6" mb={3} className="icon-text"><Icon color="primary">settings</Icon> 1. Strategic Configuration</Typography>
                                                <Grid container spacing={2}>
                                                    <Grid item xs={12}>
                                                        <TextField select fullWidth size="small" label="Sourcing Method" value={m1.method} onChange={e=>setM1({...m1, method: e.target.value})} disabled={status === "locked"}><MenuItem value="Local">Local</MenuItem><MenuItem value="China_Air">China Air</MenuItem><MenuItem value="China_Sea">China Sea</MenuItem></TextField>
                                                    </Grid>
                                                    <Grid item xs={12}>
                                                        <Typography variant="caption" color="text.secondary">Order Quantity</Typography>
                                                        <Stack direction="row" spacing={2} alignItems="center">
                                                            <Slider value={Number(m1.qty)||0} min={0} max={5000} onChange={(e,v)=>setM1({...m1, qty: v})} disabled={status === "locked"} />
                                                            <TextField type="text" size="small" value={m1.qty} onChange={e=>setM1({...m1, qty: cleanNum(e.target.value)})} sx={{width: '90px'}} disabled={status === "locked"} />
                                                        </Stack>
                                                    </Grid>

                                                    <Grid item xs={12}>
                                                        <FormControlLabel 
                                                            control={<Switch checked={m2.useBridge} onChange={e=>setM2({...m2, useBridge: e.target.checked})} disabled={status === "locked"}/>} 
                                                            label={<Typography variant="body2">Simultaneous Sourcing (Bridge)</Typography>} 
                                                        />
                                                        {m2.useBridge && (
                                                            <Box sx={{p: 2, background: 'rgba(59,130,246,0.1)', borderRadius: 2, mt: 1}}>
                                                                <TextField select fullWidth size="small" label="Bridge Method" value={m2.bridgeMethod} onChange={e=>setM2({...m2, bridgeMethod: e.target.value})} disabled={status === "locked"}>
                                                                    <MenuItem value="Local">Local</MenuItem>
                                                                    <MenuItem value="China_Air">China Air</MenuItem>
                                                                </TextField>
                                                                <Stack direction="row" spacing={2} alignItems="center" mt={2}>
                                                                    <Slider value={Number(m2.bridgeQty)||0} min={0} max={1000} onChange={(e,v)=>setM2({...m2, bridgeQty: v})} disabled={status === "locked"} />
                                                                    <TextField type="text" size="small" value={m2.bridgeQty} onChange={e=>setM2({...m2, bridgeQty: cleanNum(e.target.value)})} sx={{width: '80px'}} disabled={status === "locked"} />
                                                                </Stack>
                                                            </Box>
                                                        )}
                                                    </Grid>

                                                    <Grid item xs={12}>
                                                        <TextField select fullWidth size="small" label="Courier Partner" value={m1.courier} onChange={e=>setM1({...m1, courier: e.target.value})} disabled={status === "locked"}>{Object.keys(COURIERS).map(c => <MenuItem key={c} value={c}>{c}</MenuItem>)}</TextField>
                                                    </Grid>
                                                    <Grid item xs={12}>
                                                        <Typography variant="caption" color="text.secondary">Marketing Budget (PKR)</Typography>
                                                        <Stack direction="row" spacing={2} alignItems="center">
                                                            <Slider value={Number(m1.budget)||0} min={0} max={liquidCashAvailable + loanAmount > 0 ? liquidCashAvailable + loanAmount : 100000} onChange={(e,v)=>setM1({...m1, budget: v})} disabled={status === "locked"} />
                                                            <TextField type="text" size="small" value={m1.budget} onChange={e=>setM1({...m1, budget: cleanNum(e.target.value)})} sx={{width: '90px'}} disabled={status === "locked"} />
                                                        </Stack>
                                                    </Grid>
                                                    <Grid item xs={12}>
                                                        <Typography variant="caption" color="text.secondary">Retail Price (PKR)</Typography>
                                                        <Stack direction="row" spacing={2} alignItems="center">
                                                            <Slider value={Number(m1.price)||0} min={0} max={s.opt * 3} onChange={(e,v)=>setM1({...m1, price: v})} disabled={status === "locked"} />
                                                            <TextField type="text" size="small" value={m1.price} onChange={e=>setM1({...m1, price: cleanNum(e.target.value)})} sx={{width: '90px'}} disabled={status === "locked"} />
                                                        </Stack>
                                                    </Grid>
                                                </Grid>
                                            </div>

                                            <div className="m3-card">
                                                <Typography variant="h6" mb={2} fontSize="1rem" className="icon-text"><Icon color="primary">calculate</Icon> 2. Procure-to-Pay</Typography>
                                                <Grid container spacing={2}>
                                                    <Grid item xs={6}><TextField fullWidth size="small" label="Total Goods" value={m1.gVal} onChange={e=>setM1({...m1, gVal: cleanNum(e.target.value)})} disabled={status === "locked"} /></Grid>
                                                    <Grid item xs={6}><TextField fullWidth size="small" label="CIF Value" value={m1.cif} onChange={e=>setM1({...m1, cif: cleanNum(e.target.value)})} disabled={status === "locked"} /></Grid>
                                                    <Grid item xs={6}><TextField fullWidth size="small" label="Duty Paid" value={m1.duty} onChange={e=>setM1({...m1, duty: cleanNum(e.target.value)})} disabled={status === "locked"} /></Grid>
                                                    <Grid item xs={6}><TextField fullWidth size="small" label="Val for GST" value={m1.gstV} onChange={e=>setM1({...m1, gstV: cleanNum(e.target.value)})} disabled={status === "locked"} /></Grid>
                                                    <Grid item xs={6}><TextField fullWidth size="small" label="GST Paid" value={m1.gstP} onChange={e=>setM1({...m1, gstP: cleanNum(e.target.value)})} disabled={status === "locked"} /></Grid>
                                                    <Grid item xs={6}><TextField fullWidth size="small" label="TOTAL LANDED" value={m1.landed} onChange={e=>setM1({...m1, landed: cleanNum(e.target.value)})} disabled={status === "locked"} /></Grid>
                                                    <Grid item xs={12}><TextField fullWidth size="small" label="TRUE LANDED (Per Unit)" value={m1.trueU} onChange={e=>setM1({...m1, trueU: cleanNum(e.target.value)})} disabled={status === "locked"} /></Grid>
                                                    <Grid item xs={6}><TextField fullWidth size="small" label="Gross Margin %" value={m1.gross} onChange={e=>setM1({...m1, gross: cleanNum(e.target.value)})} disabled={status === "locked"} /></Grid>
                                                    <Grid item xs={6}><TextField fullWidth size="small" label="Op Margin %" value={m1.op} onChange={e=>setM1({...m1, op: cleanNum(e.target.value)})} disabled={status === "locked"} /></Grid>
                                                </Grid>
                                            </div>
                                        </Box>
                                    </Grid>
                                    
                                    {/* --- MAIN AREA FOR WRITTEN/UI STRATEGY --- */}
                                    <Grid item xs={12} md={8}>
                                        
                                        {user.module == 1 && (
                                            <div className="m3-card">
                                                <Typography variant="overline" color="primary" fontWeight="bold" className="icon-text"><Icon sx={{fontSize: 18}}>rocket_launch</Icon> MODULE 1 SCENARIO: THE COLD START</Typography>
                                                <Typography variant="body1" sx={{mt: 1}}>You have Rs 1,000,000 in equity and zero customers. Your goal is to launch your brand, secure inventory, and build an Atomic Network. Configure your strategy on the left to penetrate the market.</Typography>
                                            </div>
                                        )}

                                        {user.module == 2 && (
                                            <div className="m3-card" style={{border: '1px solid rgba(139, 92, 246, 0.4)'}}>
                                                <Typography variant="overline" color="#8b5cf6" fontWeight="bold" className="icon-text"><Icon sx={{fontSize: 18}}>warning_amber</Icon> MACRO SHOCK: THE RECURRING SQUEEZE</Typography>
                                                <Typography variant="body2" sx={{mt: 1, mb: 3}}>Warehouse rents have doubled. RTOs are spiking. Advertising (CAC) has instantly become <b>50% more expensive</b>. Traditional one-off sales are exhausting capital. The Board mandates you pivot a portion of your business to a <b>Recurring Revenue Model</b> to stabilize your cash flow.</Typography>
                                                <Divider sx={{my:2}}/>

                                            <Typography variant="overline" color="#94a3b8" sx={{display: 'flex', alignItems: 'center', gap: 1, mb: 1, lineHeight: 1}}>

                                                        <Grid item xs>

                                                    </>
                                                )}

                                            {user.module <= 5 && (p.m3Avail > 0 || p.m2Avail < p.demand) && (

                                        <Typography variant="h6" mb={3} className="icon-text"><Icon color="primary">receipt_long</Icon> P&L Ledger</Typography>
                                        <div style={{overflowX: 'auto'}}>
                                        <table style={{width: '100%', borderCollapse: 'collapse', textAlign: 'left', minWidth: '800px'}}>
                                            <thead><tr style={{borderBottom: '2px solid rgba(0,0,0,0.1)'}}><th>Mod</th><th>Dem / Deliv</th><th>RTO / Stockout</th><th>Revenue</th><th>Marketing</th><th>Shipping / Hold</th><th>Net Cash Flow</th></tr></thead>
                                            <tbody>
                                                {user.results.length === 0 ? <tr><td colSpan="7" style={{padding: '20px 0'}}>No simulation data yet. Complete Module 1.</td></tr> : user.results.map((r, i) => (
                                                    <React.Fragment key={i}>
                                                        <tr style={{height: '50px', borderBottom: '1px solid rgba(0,0,0,0.05)'}}>
                                                            <td><b>M{r[2]}</b></td>
                                                            <td><span style={{background:'#e0e7ff', padding:'4px 8px', borderRadius:'4px', color:'#3b82f6'}}>{r[3]}</span> / {r[7]}</td>
                                                            <td><span style={{color: '#ef4444'}}>{r[6]} RTO</span> / <span style={{color: r[5]>0?'#ef4444':'#10b981'}}>{r[5]} Out</span></td>
                                                            <td className="mono">Rs {parseInt(r[8]).toLocaleString()}</td>
                                                            <td className="mono" style={{color: '#ef4444'}}>Rs {parseInt(r[9]).toLocaleString()}</td>
                                                            <td className="mono" style={{color: '#ef4444'}}>Rs {parseInt(r[10]).toLocaleString()} / Rs {parseInt(r[11]).toLocaleString()}</td>
                                                            <td className="mono" style={{color: r[12]>0?'#10b981':'#ef4444', fontSize: '16px'}}><b>Rs {parseInt(r[12]).toLocaleString()}</b></td>
                                                        </tr>
                                                        <tr style={{borderBottom: '2px solid rgba(0,0,0,0.1)'}}>
                                                            <td colSpan="7" style={{padding: '16px', background: 'rgba(255,255,255,0.4)', borderRadius: '0 0 12px 12px'}}>
                                                                <Typography variant="body2" color="primary"><b>✨ Instructor Feedback:</b> {r[14]}</Typography>
                                                            </td>
                                                        </tr>
                                                    </React.Fragment>
                                                ))}
                                            </tbody>
                                        </table>
                                        </div>
                                    </div>
                                </>
                            )}
                        </Container>
                    </ThemeProvider>
                );
            }

            return (
                <ThemeProvider theme={theme}><CssBaseline />
                    <Container maxWidth="sm" sx={{ py: 10 }}>
                        <div className="m3-card" style={{background: 'rgba(255,255,255,0.7)'}}>
                            <Box textAlign="center" mb={4}><Typography variant="h4" fontWeight="bold" color="primary">BSMT Ecommerce</Typography><Typography variant="body2" color="text.secondary">Semester Project</Typography></Box>
                            <Tabs value={authTab} onChange={(e,v)=>setAuthTab(v)} centered sx={{mb:3}}><Tab label="Login" /><Tab label="Register" /></Tabs>
                            <Stack spacing={3}>
                                {authTab === 1 && <TextField label="Roll No (e.g. BSMT22001)" fullWidth value={form.rollNo} onChange={e=>setForm({...form, rollNo:e.target.value.toUpperCase()})} />}
                                <TextField label="Email (@itu.edu.pk)" fullWidth value={form.email} onChange={e=>setForm({...form, email:e.target.value})} />
                                <TextField label="Password" type="password" fullWidth value={form.password} onChange={e=>setForm({...form, password:e.target.value})} />
                                {authTab === 1 && (
                                    <>
                                        <TextField label="CEO Name" fullWidth value={form.ceoName} onChange={e=>setForm({...form, ceoName:e.target.value})} />
                                        <TextField label="Company Name" fullWidth value={form.companyName} onChange={e=>setForm({...form, companyName:e.target.value})} />
                                        <TextField select label="Business Niche" fullWidth value={form.niche} onChange={e=>setForm({...form, niche:e.target.value})}>
                                            {Object.keys(NICHE_DATA).map(n => <MenuItem key={n} value={n}>{n}</MenuItem>)}
                                        </TextField>
                                        <Alert severity="info" sx={{ mt: 1, borderRadius: 2, background: 'rgba(255,255,255,0.8)' }}>
                                            <AlertTitle sx={{fontFamily: 'Poppins', fontWeight: 600}}>Niche Economic Profile</AlertTitle>
                                            <Typography variant="body2" sx={{lineHeight: 1.5, fontFamily: 'Poppins'}}>{NICHE_DATA[form.niche].insight}</Typography>
                                        </Alert>
                                    </>
                                )}
                                <Button variant="contained" fullWidth size="large" onClick={()=>handleAuth(authTab===0)} disabled={status==="loading"} sx={{py: 1.5, borderRadius: 2, fontFamily: 'Poppins', fontWeight: 600}}>{status==="loading" ? <CircularProgress size={24} color="inherit"/> : (authTab===0?"Secure Login":"Incorporate Entity")}</Button>
                            </Stack>
                        </div>
                    </Container>
                </ThemeProvider>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
