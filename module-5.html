                            {/* --- TAB 3: CAPSTONE EVALUATION (MOD 6) --- */}
                            {navTab === 3 && user.module >= 6 && (
                                (user.hasSubmittedCurrentModule || user.serverTime > new Date("2026-05-17T23:59:59+05:00").getTime()) ? (
                                    <div className="max-w-4xl mx-auto bg-white p-12 rounded shadow-lg border-t-4 border-blue-600 mb-8 text-center">
                                        <Icon sx={{fontSize: 64, color: '#2563eb', mb: 2}}>lock</Icon>
                                        <Typography variant="h4" fontWeight="bold" color="#1e293b">Decision Locked</Typography>
                                        <Typography variant="h6" color="#475569" mt={2}>
                                            {user.hasSubmittedCurrentModule ? "Your corporate policies have been successfully submitted and are awaiting Evaluation." : "The submission deadline (May 17, 2026, 11:59 PM PKT) has passed."}
                                        </Typography>
                                    </div>
                                ) : (
                                    <div className="max-w-4xl mx-auto bg-white p-8 rounded shadow-lg border-t-4 border-blue-600 animate-fade-in mb-8">
                                        <Typography variant="h5" fontWeight="bold" mb={1} className="icon-text"><Icon sx={{color: '#2563eb'}}>gavel</Icon> Final Evaluation: Corporate Policy</Typography>
                                        
                                        <div className="bg-blue-50 p-5 rounded-lg border border-blue-200 mb-6 mt-4">
                                            <Typography variant="subtitle2" fontWeight="bold" color="primary">The Scenario:</Typography>
                                            <Typography variant="body2" color="text.secondary" mt={1}>
                                                Your business is experiencing steady growth; however, your formal business policies remain largely underdeveloped. To date, operations have been sustained through effective customer management. As your customer base continues to expand, it is now critical to establish comprehensive and well-defined policies for your e-commerce operations. Doing so will help preserve customer trust, mitigate the risk of losing customers, and safeguard your business from potential legal challenges.
    You are therefore required to develop clear and coherent policies, including a Shipping Policy, Return & Refund Policy, Privacy Policy, and General Terms & Conditions, using the fields provided below. You may follow the structure and guidelines discussed during the class. The deadline for submission is Sunday, 17th May 2026. 
                                            </Typography>
                                        </div>

                                        <div className="space-y-6 mb-8">
                                            <div className="bg-gray-50 p-6 rounded border">
                                                <label className="block text-sm font-bold mb-2 text-gray-700">1. Shipping Policy</label>
                                                <textarea value={m6.shipping} onChange={(e) => setM6({...m6, shipping: e.target.value})} className="w-full p-3 border border-gray-300 rounded outline-none bg-white" rows="4" placeholder="Draft your policy here..." />
                                            </div>
                                            <div className="bg-gray-50 p-6 rounded border">
                                                <label className="block text-sm font-bold mb-2 text-gray-700">2. Return & Refund Policy</label>
                                                <textarea value={m6.returns} onChange={(e) => setM6({...m6, returns: e.target.value})} className="w-full p-3 border border-gray-300 rounded outline-none bg-white" rows="4" placeholder="Draft your policy here..." />
                                            </div>
                                            <div className="bg-gray-50 p-6 rounded border">
                                                <label className="block text-sm font-bold mb-2 text-gray-700">3. Privacy Policy</label>
                                                <textarea value={m6.privacy} onChange={(e) => setM6({...m6, privacy: e.target.value})} className="w-full p-3 border border-gray-300 rounded outline-none bg-white" rows="4" placeholder="Draft your policy here..." />
                                            </div>
                                            <div className="bg-gray-50 p-6 rounded border">
                                                <label className="block text-sm font-bold mb-2 text-gray-700">4. General Terms & Conditions</label>
                                                <textarea value={m6.terms} onChange={(e) => setM6({...m6, terms: e.target.value})} className="w-full p-3 border border-gray-300 rounded outline-none bg-white" rows="4" placeholder="Draft your policy here..." />
                                            </div>
                                        </div>
                                        <Button variant="contained" size="large" fullWidth onClick={submitMod6} disabled={status === "busy"} sx={{py: 2, background: '#2563eb', fontWeight: 'bold'}}>Submit Final Corporate Policies</Button>
                                    </div>
                                )
                            )}

                            {/* --- TAB 4: INBOX --- */}
                            {navTab === (user.module >= 6 ? 4 : 3) && user.module >= 5 && (
                                <div className="m3-card max-w-4xl mx-auto">
                                    <Typography variant="h5" fontWeight="bold" mb={4} className="icon-text"><Icon sx={{color: '#3b82f6'}}>inbox</Icon> Official Communications</Typography>
                                    
                                    {user.notifications && user.notifications.length > 0 ? (
                                        <div className="space-y-4">
                                            {user.notifications.map((notif, idx) => (
                                                <div key={idx} className="bg-white p-5 rounded-xl border-l-4 border-blue-500 shadow-sm">
                                                    <Typography variant="caption" color="text.secondary" fontWeight="bold">{new Date(notif.date).toLocaleString()}</Typography>
                                                    <Typography variant="h6" color="#1e293b" mt={1}>{notif.title}</Typography>
                                                    <Typography variant="body1" color="#475569" mt={1}>{notif.message}</Typography>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center p-10 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                                            <Typography color="text.secondary">Your inbox is empty.</Typography>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* FLOATING BOTTOM FORECAST BAR */}
                            {navTab === 0 && (user.module >= 5 || !user.hasSubmittedCurrentModule) && (
                                <Box className={`bottom-bar ${minimized ? 'minimized' : ''}`}>
                                    <div className="toggle-btn" onClick={()=>setMinimized(!minimized)}><Icon>{minimized ? 'expand_less' : 'expand_more'}</Icon></div>
                                    <Grid container spacing={3} alignItems="center">
                                        <Grid item xs={12} md={8}>
                                            {user.module >= 5 ? (
                                                <>
                                                    <Typography variant="overline" color="#94a3b8" sx={{display: 'flex', alignItems: 'center', gap: 1, mb: 1, lineHeight: 1}}><Icon sx={{fontSize: 16}}>inventory_2</Icon> INVENTORY & PERFORMANCE CONTROL</Typography>
                                                    <Grid container spacing={2}>
                                                        <Grid item xs><Typography variant="caption" color="#cbd5e1" display="block">AVAILABLE TO SELL</Typography><Typography variant="h5" color={currentLiveInventory > 0 ? "#3b82f6" : "#ef4444"} className="mono">{currentLiveInventory.toLocaleString()}</Typography></Grid>
                                                        <Grid item xs><Typography variant="caption" color="#cbd5e1" display="block">IN TRANSIT</Typography><Typography variant="h5" color="#f59e0b" className="mono">{shipments.filter(s => (liveTick - s.orderedAtTick) < (s.method === 'Local' ? 0 : (s.method === 'China_Air' ? 360 : 720))).reduce((sum, s) => sum + s.qty, 0).toLocaleString()}</Typography></Grid>
                                                        <Grid item xs sx={{borderLeft: '1px solid rgba(255,255,255,0.2)', pl: 2}}><Typography variant="caption" color="#cbd5e1" display="block">STOCKOUTS (CHURN)</Typography><Typography variant="h5" color="#ef4444" className="mono">{salesData.stockouts || 0}</Typography></Grid>
                                                        <Grid item xs><Typography variant="caption" color="#cbd5e1" display="block">RETAINED SALES</Typography><Typography variant="h5" color="#8b5cf6" className="mono">{salesData.retained || 0}</Typography></Grid>
                                                    </Grid>
                                                </>
                                            ) : (
                                                <><Typography variant="overline" color="#94a3b8" sx={{display: 'flex', alignItems: 'center', gap: 1, mb: 1, lineHeight: 1}}><Icon sx={{fontSize: 16}}>query_stats</Icon> FORECAST</Typography><Typography variant="caption" color="#cbd5e1">Submit your decision to lock this module.</Typography></>
                                            )}
                                        </Grid>
                                        <Grid item xs={12} md={4}>
                                            {user.module >= 5 ? (
                                                <Button variant="contained" fullWidth size="large" onClick={handleOrderInventory} disabled={orderCooldownActive} sx={{py: 2, borderRadius: 3, fontWeight: 700, background: orderCooldownActive ? '#64748b' : '#3b82f6'}}>{orderCooldownActive ? "Order Locked (Cooldown)" : "Order Inventory"}</Button>
                                            ) : (<Button variant="contained" fullWidth size="large" onClick={submit} disabled={status === "busy"} sx={{py: 2, borderRadius: 3, fontWeight: 700}}>Submit Strategy</Button>)}
                                        </Grid>
                                    </Grid>
                                </Box>
                            )}

                            {/* TAB 5: HISTORICAL PERFORMANCE */}
                            {navTab === (user.module >= 6 ? 5 : (user.module >= 5 ? 4 : 1)) && (
                                <div className="m3-card"><PerformanceChart results={user.results} /></div>
                            )}
                        </Container>
                    </ThemeProvider>
                );
            }

            return (
                <ThemeProvider theme={theme}><CssBaseline />
                    <Container maxWidth="sm" sx={{ py: 10 }}>
                        <div className="m3-card" style={{background: 'rgba(255,255,255,0.7)'}}>
                            <Box textAlign="center" mb={4}><Typography variant="h4" fontWeight="bold" color="primary">BSMT Ecommerce</Typography></Box>
                            <Tabs value={authTab} onChange={(e,v)=>setAuthTab(v)} centered sx={{mb:3}}><Tab label="Login" /><Tab label="Register" /></Tabs>
                            <Stack spacing={3}>
                                {authTab === 1 && <TextField label="Roll No" fullWidth value={form.rollNo} onChange={e=>setForm({...form, rollNo:e.target.value.toUpperCase()})} />}
                                <TextField label="Email (@itu.edu.pk)" fullWidth value={form.email} onChange={e=>setForm({...form, email:e.target.value})} />
                                <TextField label="Password" type="password" fullWidth value={form.password} onChange={e=>setForm({...form, password:e.target.value})} />
                                <Button variant="contained" fullWidth size="large" onClick={()=>handleAuth(authTab===0)} disabled={status==="loading"}>{status==="loading" ? "Loading..." : "Enter"}</Button>
                            </Stack>
                        </div>
                    </Container>
                </ThemeProvider>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
