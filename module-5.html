<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSMT Ecommerce Semester Project - CLOSED</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@mui/material@5.15.0/umd/material-ui.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { 
            margin: 0; font-family: 'Poppins', sans-serif;
            background: linear-gradient(225deg, #8399a2 0%, #eef2f3 100%);
            min-height: 100vh; background-attachment: fixed;
        }
        .mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .m3-card { 
            background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            border-radius: 24px; padding: 24px; margin-bottom: 24px; 
        }
        .icon-text { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createTheme, ThemeProvider, CssBaseline, Container, Typography, TextField, Button, Box, Grid, Stack, Icon } = MaterialUI;

        const theme = createTheme({ 
            palette: { primary: { main: '#3b82f6' }, background: { default: 'transparent' } }, 
            shape: { borderRadius: 16 }, typography: { fontFamily: 'Poppins', h5: { fontWeight: 700 }, h6: { fontWeight: 600 } }
        });

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyX6MniGhWOILDUQQlxSTPmKxFM8wilkTP3qiQ0Tq3ZbZCVPFJaZcBrJ-Uc_UNZ_YCoNw/exec"; 

        function App() {
            const SIMULATION_CLOSED = true; 

            const [view, setView] = useState("auth"); 
            const [status, setStatus] = useState("idle"); 
            const [user, setUser] = useState(null); 
            const [form, setForm] = useState({ rollNo: "", email: "", password: ""});

            useEffect(() => {
                const saved = localStorage.getItem('student_creds');
                if(saved) {
                    const creds = JSON.parse(saved);
                    setForm(f => ({...f, email: creds.email, password: creds.password}));
                    handleAuth(true, creds.email, creds.password);
                }
            }, []);

            const handleAuth = async (isLogin, em = form.email, pw = form.password) => {
                setStatus("loading");
                try {
                    if(isLogin) {
                        const res = await fetch(`${SCRIPT_URL}?action=login&email=${encodeURIComponent(em)}&password=${encodeURIComponent(pw)}`).then(r => r.json());
                        if(res.status === "success") { 
                            res.data.module = parseInt(res.data.module, 10);
                            setUser(res.data); 
                            setView("dashboard"); 
                            localStorage.setItem('student_creds', JSON.stringify({email: em, password: pw}));
                        } else { 
                            alert(res.message); 
                            localStorage.removeItem('student_creds'); 
                        }
                    }
                } catch (e) { alert("Connection Error."); }
                setStatus("idle");
            };

            const logout = () => { localStorage.removeItem('student_creds'); setUser(null); setView("auth"); }

            // ============================================================================
            // CLOSED DASHBOARD VIEW
            // ============================================================================
            if (SIMULATION_CLOSED && view === "dashboard" && user) {
                return (
                    <ThemeProvider theme={theme}><CssBaseline />
                        <Container maxWidth="md" sx={{ pt: 10, pb: 10 }}>
                            
                            {/* HEADER INFRASTRUCTURE */}
                            <Box display="flex" justifyContent="space-between" alignItems="center" mb={6}>
                                <div>
                                    <Typography variant="h4" fontWeight="bold" color="#1e293b" className="icon-text">
                                        <Icon sx={{fontSize: 32, color: '#3b82f6'}}>verified_user</Icon> {user.companyName}
                                    </Typography>
                                    <Typography variant="body1" color="#475569" sx={{ml: 5}}>{user.rollNo} • Niche: {user.niche}</Typography>
                                </div>
                                <Button variant="outlined" color="error" onClick={logout} startIcon={<Icon>logout</Icon>} sx={{ borderRadius: 3, fontWeight: 'bold' }}>
                                    Logout
                                </Button>
                            </Box>

                            {/* ELEGANT CLOSED ANNOUNCEMENT CARD */}
                            <Box sx={{
                                background: 'linear-gradient(135deg, #1e293b 0%, #0f172a 100%)',
                                p: { xs: 4, md: 8 },
                                borderRadius: 6,
                                color: 'white',
                                boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1)',
                                textAlign: 'center',
                                position: 'relative',
                                overflow: 'hidden'
                            }}>
                                {/* Decorative background element */}
                                <Box sx={{ position: 'absolute', top: -30, right: -30, opacity: 0.05, transform: 'rotate(15deg)' }}>
                                    <Icon sx={{ fontSize: 250 }}>lock_clock</Icon>
                                </Box>

                                <Icon sx={{fontSize: 72, color: '#60a5fa', mb: 3}}>task_alt</Icon>
                                
                                <Typography variant="h3" fontWeight="800" mb={3} sx={{ letterSpacing: '-1px' }}>
                                    Semester Project Closed
                                </Typography>
                                
                                <Typography variant="h6" sx={{ color: '#94a3b8', fontWeight: 400, maxWidth: '600px', mx: 'auto', lineHeight: 1.8 }}>
                                    The project has ended. Good Luck for your final exams.
                                    <br /><br />
                                    <span style={{ color: '#f8fafc', fontWeight: 600, fontSize: '1.15rem' }}>
                                        Your final brand score will be posted soon.
                                    </span>
                                </Typography>
                            </Box>

                        </Container>
                    </ThemeProvider>
                );
            }

            // ============================================================================
            // AUTHENTICATION LOGIN
            // ============================================================================
            return (
                <ThemeProvider theme={theme}><CssBaseline />
                    <Container maxWidth="sm" sx={{ py: 10 }}>
                        <div className="m3-card" style={{background: 'rgba(255,255,255,0.7)'}}>
                            <Box textAlign="center" mb={4}>
                                <Typography variant="h4" fontWeight="bold" color="primary">BSMT Ecommerce</Typography>
                            </Box>
                            
                            <Stack spacing={3} mt={4}>
                                <TextField label="Email (@itu.edu.pk)" fullWidth value={form.email} onChange={e=>setForm({...form, email:e.target.value})} />
                                <TextField label="Password" type="password" fullWidth value={form.password} onChange={e=>setForm({...form, password:e.target.value})} />
                                <Button variant="contained" fullWidth size="large" onClick={()=>handleAuth(true)} disabled={status==="loading"} sx={{ py: 1.5, fontSize: '1.1rem', fontWeight: 'bold' }}>
                                    {status==="loading" ? "Authenticating..." : "Login"}
                                </Button>
                            </Stack>
                        </div>
                    </Container>
                </ThemeProvider>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
